# SonarCloud — https://sonarcloud.io
# Set organization/projectKey in SonarCloud UI to match (or override via CI env).
sonar.organization=devopstem
sonar.projectKey=devopstem_plna_web_backend
sonar.projectName=PLNA Web Backend

sonar.sources=app,routes,resources
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# PHPUnit Clover report produced in CI (see .github/workflows/ci.yml).
sonar.php.coverage.reportPaths=coverage/clover.xml

sonar.exclusions=**/vendor/**,**/node_modules/**,**/public/build/**,**/storage/**,**/bootstrap/cache/**
sonar.test.exclusions=**/vendor/**,**/node_modules/**
