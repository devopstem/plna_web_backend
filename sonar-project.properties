# SonarCloud — https://sonarcloud.io/project/overview?id=devopstem_plna_web_backend
# Organization / projectKey must match the SonarCloud UI (override via CI env if needed).
# Token: GitHub Actions secret SONAR_TOKEN (never commit).

sonar.organization=devopstem
sonar.projectKey=devopstem_plna_web_backend
sonar.projectName=PLNA Web Backend
sonar.projectVersion=2.7.0

sonar.sources=app,routes,resources
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.language=php

# PHPUnit reports from CI (.github/workflows/ci.yml).
sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.php.tests.reportPath=coverage/junit.xml

# Keep noise down: build artifacts, deps, caches, compiled assets.
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/public/build/**,\
  **/storage/**,\
  **/bootstrap/cache/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/resources/js/**/*.css

# JS/CSS and route files are not covered by PHPUnit Clover — exclude from coverage % only.
sonar.coverage.exclusions=\
  **/resources/**,\
  **/routes/**,\
  **/database/**,\
  **/config/**,\
  **/bootstrap/**

sonar.test.exclusions=**/vendor/**,**/node_modules/**,**/coverage/**

# Duplication in generated-looking React pages is less actionable than PHP services.
sonar.cpd.exclusions=**/resources/js/**

sonar.scm.provider=git
